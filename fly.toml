app = "inspectcheck-dashboard-walison"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  COLLECT_SCHEDULE_ENABLED = "true"
  COLLECT_SCHEDULE_TZ = "America/Cuiaba"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "15s"
    grace_period = "90s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
